
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
.wrap{font-family:'Inter',sans-serif;padding:2.4rem 3rem;background:#fff;color:#18160F;max-width:1280px;margin:0 auto}
.title{font-size:30px;font-weight:500;color:#18160F;margin:0 0 8px;line-height:1.35;letter-spacing:-0.01em}
.sub{font-size:19px;color:#6A6158;margin:0 0 32px}
.axis{font-size:14px;color:#6A6158;margin:10px 0 0}
.source{font-size:15px;color:#ABA49B;margin:26px 0 0}
</style>

<div class="wrap">
  <p class="title"><span style="color:#C0392B;">Saturday</span> generates less than 1% of weekly revenue. Almost all trading occurs Monday to Friday</p>
  <p class="sub">Total revenue by day of week (&pound;)</p>
  <div style="position:relative;width:100%;height:540px;">
    <canvas id="dayChart"></canvas>
  </div>
  <p class="source">Source: UCI Machine Learning Repository &mdash; Online Retail II dataset</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const revenue = [3416751.16, 3880183.26, 3375311.19, 4010238.02, 3167357.88, 9803.05, 1785174.11];
const minIdx = revenue.indexOf(Math.min(...revenue));
const fontFamily = "'Inter', sans-serif";
const tickColor = '#4A453E';
const gridColor = 'rgba(136,135,128,0.20)';
const barColors = revenue.map((_,i) => i === minIdx ? '#C0392B' : '#C8C5BB');

const datalabelPlugin = {
  id: 'datalabel',
  afterDatasetsDraw(chart) {
    const {ctx} = chart;
    const meta = chart.getDatasetMeta(0);
    meta.data.forEach((bar, i) => {
      if (i !== minIdx) return;
      const label = '\u00A3' + revenue[i].toLocaleString('en-GB', {minimumFractionDigits:0, maximumFractionDigits:0});
      ctx.save();
      ctx.font = `600 22px ${fontFamily}`;
      ctx.fillStyle = '#C0392B';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(label, bar.x, bar.y - 10);
      ctx.restore();
    });
  }
};

Chart.defaults.devicePixelRatio = Math.max(window.devicePixelRatio || 1, 2);
new Chart(document.getElementById('dayChart'), {
  type: 'bar',
  data: {
    labels: days,
    datasets: [{
      data: revenue,
      backgroundColor: barColors,
      borderRadius: 4,
      maxBarThickness: 150,
      categoryPercentage: 0.82,
      borderSkipped: false
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: ctx => ` \u00A3${ctx.parsed.y.toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2})}`
        }
      }
    },
    scales: {
      x: {
        grid: { display: false },
        ticks: {
          font: { size: 18, family: fontFamily },
          padding: 8,
          color: (ctx) => days[ctx.index] === 'Saturday' ? '#C0392B' : tickColor
        }
      },
      y: {
        grid: { color: gridColor },
        border: { display: false },
        ticks: {
          font: { size: 17, family: fontFamily },
          color: tickColor,
          padding: 8,
          callback: v => v >= 1000000 ? '\u00A3' + (v/1000000).toFixed(1) + 'M' : v >= 1000 ? '\u00A3' + (v/1000).toFixed(0) + 'K' : '\u00A3' + v
        }
      }
    }
  },
  plugins: [datalabelPlugin]
});
</script>
